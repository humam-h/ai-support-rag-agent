services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-support-postgres
    environment:
      POSTGRES_DB: support_rag
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d support_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ai-support-api
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://support_user:support_password@postgres:5432/support_rag
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    profiles:
      - tools
    build: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://support_user:support_password@postgres:5432/support_rag
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.ingest"]

volumes:
  postgres_data:
  n8n_data: